# Local stack. `docker compose up -d` starts Postgres (schema and seed data loaded) and the
# identity provider. `docker compose --profile app up -d --build` also builds and starts the
# API and the web app, which then run at http://localhost:8081. Settings come from .env (copy .env.example), and
# every value has a default so the stack also starts without one.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs every .sql file in this folder, in name order, but only the
      # first time the data volume is empty. To reload, run `docker compose down -v`.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local identity provider (OpenID Connect). Demo users and roles come from
  # keycloak/booking-realm.json, imported on first start. Data is not kept between
  # `docker compose down` runs, so the realm is rebuilt fresh each time.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # The API and web app as containers. Optional: for day-to-day development run them with
  # `npm run dev` instead. They are behind a profile so a plain `docker compose up` stays light.
  api:
    profiles: [app]
    build: .
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking_dev_password}@db:5432/${POSTGRES_DB:-booking}
      # Tokens carry the address the browser used (localhost); the keys are fetched over the
      # compose network, where Keycloak is called keycloak.
      OIDC_ISSUER: http://localhost:8080/realms/booking
      OIDC_JWKS_URI: http://keycloak:8080/realms/booking/protocol/openid-connect/certs
      OIDC_AUDIENCE: booking-api
      TRUST_PROXY: "true" # nginx sits in front, so use the address it forwards
    ports:
      - "3000:3000"

  web:
    profiles: [app]
    build: ./web
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
