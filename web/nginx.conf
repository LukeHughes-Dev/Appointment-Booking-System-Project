server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API, without the /api prefix (the same rewrite the Vite dev server does).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Anything else is a page of the app: let the browser router decide.
  location / {
    try_files $uri /index.html;
  }

  # Hashed build files never change, so they can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
